name: Build Nama

on:
  push:
    branches-ignore: [ci-screenshots]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Release signing key (optional secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.NAMA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nama.jks"
            echo "NAMA_KEYSTORE_FILE=$RUNNER_TEMP/nama.jks" >> "$GITHUB_ENV"
            echo "Using the private release key from secrets."
          else
            echo "No signing secrets; using the public development key in keystore/."
          fi

      - name: Build release APK
        env:
          NAMA_KEYSTORE_PASSWORD: ${{ secrets.NAMA_KEYSTORE_PASSWORD }}
          NAMA_KEY_ALIAS: ${{ secrets.NAMA_KEY_ALIAS }}
          NAMA_KEY_PASSWORD: ${{ secrets.NAMA_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Nama-1.0.${{ github.run_number }}.apk"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/Nama.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: nama-apk
          path: out/*.apk

      - name: Publish the latest test build
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: "نما — آخرین نسخه آزمایشی (${{ github.ref_name }})"
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            آخرین نسخه ساخته‌شده از شاخه `${{ github.ref_name }}` (ساخت شماره ${{ github.run_number }}، commit ${{ github.sha }}).
            فایل APK را روی گوشی دانلود و نصب کنید. نصب، نما را لانچر پیش‌فرض نمی‌کند؛ هر وقت خواستید از تنظیمات گوشی به لانچر قبلی برگردید.
          files: release/Nama.apk

  emulator-smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nama-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/smoke.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/

      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.event_name != 'pull_request'
        run: |
          [ -d shots ] || exit 0
          cp -r shots /tmp/shots
          git config user.name "nama-ci"
          git config user.email "nama-ci@users.noreply.github.com"
          git checkout --orphan ci-shots-tmp
          git rm -rf . -q
          rm -rf ./* || true
          cp /tmp/shots/* .
          echo "Screenshots for ${{ github.sha }} (${{ github.ref_name }})" > README.md
          git add -A
          git commit -q -m "Screenshots for ${{ github.sha }}"
          git push -f origin HEAD:ci-screenshots
